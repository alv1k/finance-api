function updateDashGoalsCard(){
  var dashGoalsCard=document.getElementById('dash-goals-card')
  if(!dashGoalsCard||!curInst)return
  api('api/instances/'+curInst.id+'/savings').then(function(sav){
    if(!dashGoalsCard.isConnected)return
    dashGoalsCard.innerHTML=''
    dashGoalsCard.appendChild(el('div',{className:'card-title'},'🏦 Цели накоплений'))
    if(!sav.goals||!sav.goals.length){
      dashGoalsCard.appendChild(el('div',{style:'text-align:center;padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:12px'},[
        el('div',{style:'color:var(--text3);font-size:13px'},'Нет активных целей накоплений'),
        el('button',{className:'primary sm',onclick:function(){showSavGoalForm(null)}},'🎯 Поставить цель!')
      ]))
    }else{
      for(var gi=0;gi<sav.goals.length;gi++){
        var g=sav.goals[gi]
        var saved=parseFloat(g.saved||0)
        var target=parseFloat(g.target_amount||0)
        var pct=target>0?Math.min(Math.round((saved/target)*100),100):0
        dashGoalsCard.appendChild(el('div',{style:'padding:8px 12px;background:var(--surface2);border-radius:var(--rs);margin-bottom:6px'},[
          el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px'},[
            el('span',{style:'font-size:13px;font-weight:500'},g.name),
            el('span',{style:'font-size:12px;color:var(--text3)'},fmt(saved)+' / '+fmt(target)+' ₽')
          ]),
          el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px'},[
            el('span',{style:'font-size:11px;color:var(--text3)'},g.target_date?fmtDateLong(g.target_date):''),
            el('span',{style:'font-size:12px;font-weight:600;color:'+(pct>=100?'var(--green)':'var(--accent)')},pct+'%')
          ]),
          el('div',{style:'height:5px;background:var(--border);border-radius:3px;overflow:hidden'},[
            el('div',{style:'height:100%;width:'+pct+'%;background:'+(pct>=100?'var(--green)':'var(--accent)')+';border-radius:3px'})
          ])
        ]))
      }
    }
    if(sav.freeTotal>0){
      dashGoalsCard.appendChild(el('div',{style:'display:flex;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--text3)'},[
        el('span',{},'Свободные накопления'),
        el('span',{style:'color:var(--green)'},fmt(sav.freeTotal)+' ₽')
      ]))
    }
  }).catch(function(){
    if(dashGoalsCard.isConnected){
      dashGoalsCard.innerHTML=''
      dashGoalsCard.appendChild(el('div',{className:'card-title'},'🏦 Цели накоплений'))
      dashGoalsCard.appendChild(el('div',{style:'text-align:center;padding:16px;color:var(--text3)',textContent:'Ошибка загрузки'}))
    }
  })
}

          ]),
          el('div',{className:'stat'},[
            el('div',{className:'lbl'},'В кредиты'),
            el('div',{className:'val g'},fmt(s.credits.total)+' ₽'),
            el('div',{className:'sub'},s.credits.count+' операций')
          ])
        ])
      ]))

      // Summary stats card is already appended above (first element in dashboard)

      // Monthly chart

          var r=d.byMonth[i]
          if(!mm[r.month])mm[r.month]={m:r.month,e:0,i:0}
          if(r.type==='expense')mm[r.month].e=parseFloat(r.total)
          else mm[r.month].i=parseFloat(r.total)
        }
        var months=[]
        for(var k in mm)months.push(mm[k])
        var maxV=1
        for(var j=0;j<months.length;j++){
          maxV=Math.max(maxV,months[j].e,months[j].i)
        }
        var bars=[]
        for(var m2=0;m2<months.length;m2++){
          var mo=months[m2]
          var hInc=Math.round((mo.i/maxV)*150)
          var hExp=Math.round((mo.e/maxV)*150)
          bars.push(el('div',{className:'bar-grp'},[
            el('div',{className:'bar',style:'height:'+hInc+'px;background:var(--green)',title:'Доход: '+fmt(mo.i)+' ₽'},
              el('span',{className:'tip'},'+'+fmt(mo.i))),
            el('div',{className:'bar',style:'height:'+hExp+'px;background:var(--red)',title:'Расход: '+fmt(mo.e)+' ₽'},
              el('span',{className:'tip'},'-'+fmt(mo.e))),
            el('span',{className:'bar-lbl'},fmtM(mo.m))
          ]))
        }
        p.appendChild(el('div',{className:'card'},[
          el('div',{className:'card-title'},'Доходы и расходы по месяцам'),
          el('div',{className:'chart-wrap'},bars)
        ]))
      }

      // Savings goals — logically placed after main budget summary & charts
      var dashGoalsCard=el('div',{id:'dash-goals-card',className:'card',style:'margin-bottom:16px'})
      var dashGoalsHeader=el('div',{className:'card-title'},'🏦 Цели накоплений')
      dashGoalsCard.appendChild(dashGoalsHeader)
      var dashGoalsLoading=el('div',{style:'text-align:center;padding:16px;color:var(--text3)',textContent:'Загрузка...'})
      dashGoalsCard.appendChild(dashGoalsLoading)
      p.appendChild(dashGoalsCard)
      updateDashGoalsCard()

      // Shopping list widget — utility block below goals
      var shoppingCard=el('div',{className:'card',style:'margin-bottom:16px'})
      p.appendChild(shoppingCard)
      loadShoppingWidget(shoppingCard)

      // Planned expenses summary
      api('api/instances/'+curInst.id+'/transactions?is_planned=true&limit=100').then(function(planned){
        if(!planned.data||!planned.data.length)return
        var plannedTotal=0
        var overdueTotal=0
        var today=new Date().toISOString().slice(0,10)
        for(var pi=0;pi<planned.data.length;pi++){
          plannedTotal+=parseFloat(planned.data[pi].amount)
          if(planned.data[pi].planned_date&&planned.data[pi].planned_date<today)overdueTotal+=parseFloat(planned.data[pi].amount)
        }
        if(plannedTotal>0){
          var plannedCard=el('div',{className:'card',style:'margin-bottom:16px'})
          plannedCard.appendChild(el('div',{className:'card-title'},'📅 Запланированные расходы'))
          var stats=[
            {label:'Всего запланировано',value:fmt(plannedTotal)+' ₽',sub:planned.data.length+' позиций',color:''},
            {label:'Просрочено',value:fmt(overdueTotal)+' ₽',sub:overdueTotal>0?'Требует внимания':'Нет просроченных',color:overdueTotal>0?'r':''}
          ]
          if(s.balance-plannedTotal>=0){
            stats.push({label:'Ожидаемый баланс',value:fmt(s.balance-plannedTotal)+' ₽','sub':'После выполнения',color:'g'})
          }
          plannedCard.appendChild(el('div',{className:'stats-grid',style:'margin-bottom:0'},stats.map(function(st){
            return el('div',{className:'stat'},[
              el('div',{className:'lbl'},st.label),
              el('div',{className:'val '+(st.color||'')},st.value),
              el('div',{className:'sub'},st.sub)
            ])
          })))
          p.appendChild(plannedCard)
        }
        checkTodayPlannedExpenses(planned.data)
      }).catch(function(){})


      // Pie charts for categories
      var pieColors=['#ef4444','#f59e0b','#22c55e','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#06b6d4','#e11d48','#a855f7','#10b981','#f43f5e','#0ea5e9','#d946ef','#64748b']

      function makePieChart(data,title,total){
        if(!data||!data.length)return null
        var size=180, cx=size/2, cy=size/2, r=70
        var total=0
        for(var i=0;i<data.length;i++)total+=parseFloat(data[i].total)
        var slices=[]
        var legend=[]
        var startAngle=-Math.PI/2
        for(var i=0;i<data.length;i++){
          var slice=data[i]
          var angle=(parseFloat(slice.total)/total)*Math.PI*2
          var endAngle=startAngle+angle
          var x1=cx+r*Math.cos(startAngle), y1=cy+r*Math.sin(startAngle)
          var x2=cx+r*Math.cos(endAngle), y2=cy+r*Math.sin(endAngle)
          var largeArc=angle>Math.PI?1:0
          var sweep=1
          var path='M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+largeArc+' '+sweep+' '+x2+' '+y2+' Z'
          var color=pieColors[i%pieColors.length]
          slices.push(el('path',{d:path,fill:color,stroke:'var(--surface)','stroke-width':'1'}))
          var pct=Math.round((parseFloat(slice.total)/total)*100)
          legend.push(el('div',{style:'display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px'},[
            el('span',{style:'width:10px;height:10px;border-radius:2px;background:'+color+'',display:'inline-block'}),
            el('span',{style:'flex:1;color:var(--text2)'},slice.category||'Без категории'),
            el('span',{style:'color:var(--text3)'},pct+'%'),
            el('span',{style:'font-weight:500'},fmt(parseFloat(slice.total))+' ₽')
          ]))
          startAngle=endAngle
        }
        var svgEl=el('svg',{viewBox:'0 0 '+size+' '+size,width:size,height:size},slices)
        return el('div',{className:'card'},[
          el('div',{className:'card-title'},title),
          el('div',{style:'display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap'},[
            el('div',{style:'flex-shrink:0'},svgEl),
            el('div',{style:'flex:1;min-width:160px'},legend)
          ])
        ])
      }

      var expCats=(d.byCategory||[]).filter(function(c){return c.type==='expense'})
      if(expCats.length){
        var pie=makePieChart(expCats,'Расходы по категориям',s.expense.total)
        if(pie)p.appendChild(pie)
      }

      var incCats=(d.byCategory||[]).filter(function(c){return c.type==='income'})
      if(incCats.length){
        var pie=makePieChart(incCats,'Доходы по категориям',s.income.total)
        if(pie)p.appendChild(pie)
      }

      // Recent transactions
      if(d.recent&&d.recent.length){
        var rows=[]
        for(var r2=0;r2<d.recent.length;r2++){
          var tx=d.recent[r2]
          var isWithdrawal = tx.type === 'savings' && tx.savings_type === 'withdrawal'
          var sign = (tx.type === 'expense' || isWithdrawal) ? '-' : '+'
          var cls2 = (tx.type === 'expense' || isWithdrawal) ? 'exp' : 'inc'
          var typeLabel = tx.type === 'expense' ? 'расход' : (tx.type === 'income' ? 'доход' : (isWithdrawal ? 'изъятие' : 'накопления'))
          var badgeClass = tx.type === 'expense' ? 'expense' : (tx.type === 'income' ? 'income' : 'savings')
          rows.push(el('tr',{},[
            el('td',{},fmtD(tx.date)),
            el('td',{},el('span',{className:'badge badge-'+badgeClass},typeLabel)),
            el('td',{className:'el-name'},[
              el('div',{},tx.name),
              tx.comment ? el('div',{style:'font-size:11px;color:var(--text3);margin-top:2px'},tx.comment) : null
            ]),
            el('td',{},tx.category||'—'),
            el('td',{className:'amt '+cls2},sign+fmt(tx.amount)+' ₽')
          ]))
        }

        p.appendChild(el('div',{className:'card'},[
          el('div',{className:'card-title'},'Последние операции'),
          el('table',{},[
            el('thead',{},el('tr',{},[el('th',{},'Дата'),el('th',{},'Тип'),el('th',{},'Название'),el('th',{},'Категория'),el('th',{},'Сумма')])),
            el('tbody',{},rows)
          ])
        ]))
      }
    })
    .catch(function(e){console.error(e)})
}

var debounceTimer
function debounce(fn,ms){
  return function(){
    clearTimeout(debounceTimer)
    var args=arguments
    var self=this
    debounceTimer=setTimeout(function(){fn.apply(self,args)},ms)
  }
}

function loadTxData(){
  var cont=document.getElementById('tx-table')
  if(!cont)return
  var params=new URLSearchParams({limit:txLimit,offset:txPage*txLimit})
  if(txFilters.type)params.set('type',txFilters.type)
  if(txFilters.category)params.set('category_id',txFilters.category)
  if(txFilters.from)params.set('from',txFilters.from)
  if(txFilters.to)params.set('to',txFilters.to)
  if(txFilters.search)params.set('search',txFilters.search)
  if(txFilters.is_planned!==undefined)params.set('is_planned',txFilters.is_planned)

  // Exclude savings transactions from the main list
  params.set('exclude_type', 'savings')
  api('api/instances/'+curInst.id+'/transactions?'+params.toString())
    .then(function(d){
      if(!d.data.length){
        cont.innerHTML=''
        cont.appendChild(el('div',{className:'empty'},[el('div',{className:'ic'},'📭'),el('p',{},'Нет транзакций')]))
        return
      }
      var rows=[]
      for(var i=0;i<d.data.length;i++){
        var r=d.data[i]
        var isPlanned=r.is_planned
        var sign=r.type==='expense'?'-':'+'
        var cls=r.type==='expense'?'exp':'inc'
        var typeLabel = ''
        if (r.type === 'income') typeLabel = 'доход'
        else if (r.type === 'savings') typeLabel = 'накопления'
        else if (isPlanned) typeLabel = r.is_recurring ? 'ежемесячно' : 'запланировано'
        else typeLabel = 'расход'
        var priceQty=''
        if(r.price&&r.quantity){
          priceQty=fmt(r.price)+' ₽ × '+r.quantity
        }
        var dateDisplay=isPlanned&&r.planned_date?el('span',{style:r.planned_date<new Date().toISOString().slice(0,10)?'color:var(--red2)':'color:var(--orange)'},(r.is_recurring?'🔄 ':'📅 ')+fmtD(r.planned_date)):fmtD(r.date)
        var rowStyle=isPlanned&&r.planned_date<new Date().toISOString().slice(0,10)?'background:rgba(239,68,68,.05)':''
        var actionTd=[el('button',{className:'sm ghost',style:'width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center'+(isPlanned?';margin-left:4px':''),onclick:(function(tx){return function(){showTxForm(tx)}})(r)},'✏️')]
        if(isPlanned){
          actionTd.unshift(el('button',{className:'sm success',style:'width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center',onclick:(function(id){return function(){
            api('api/instances/'+curInst.id+'/transactions/'+id+'/execute',{method:'POST'})
              .then(function(){toast('Выполнено');loadTxData();loadDash()})
              .catch(function(e){toast(e.message,'err')})
          }})(r.id)},'✓'))
        }
        actionTd.push(el('button',{className:'sm danger',style:'width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;margin-left:4px',onclick:(function(id){return function(){delTx(id)}})(r.id)},'🗑'))
        rows.push(el('tr',{style:rowStyle},[
          el('td',{},dateDisplay),
          el('td',{},el('span',{className:'badge badge-'+(isPlanned?'expense':r.type)},typeLabel)),
          el('td',{className:'el-name'},[
            el('div',{},(r.is_recurring ? '🔄 ' : '') + r.name),
            r.comment ? el('div',{style:'font-size:11px;color:var(--text3);margin-top:2px'},r.comment) : null
          ]),

          el('td',{},r.category||'—'),
          el('td',{},priceQty),
          el('td',{className:'amt '+cls},sign+fmt(r.amount)+' ₽'),
          el('td',{className:'td-actions'},actionTd)
        ]))
      }
      cont.innerHTML=''
      cont.appendChild(el('table',{},[
        el('thead',{},el('tr',{},[el('th',{},'Дата'),el('th',{},'Тип'),el('th',{},'Название'),el('th',{},'Категория'),el('th',{},'Цена × Кол-во'),el('th',{},'Сумма'),el('th',{},'')])),
        el('tbody',{},rows)
      ]))

      if(d.total>txLimit){
        var pages=Math.ceil(d.total/txLimit)
        var pg=el('div',{className:'pager'})
        pg.appendChild(el('button',{className:'sm ghost',disabled:txPage===0,onclick:function(){if(txPage>0){txPage--;loadTxData()}}},'‹'))
        var items=buildPagerPages(txPage,pages)
        for(var k=0;k<items.length;k++){
          if(items[k].t==='e'){
            pg.appendChild(el('span',{className:'pager-dots'},'…'))
            continue
          }
          var pageNum=items[k].v
          ;(function(pageNum){
            pg.appendChild(el('button',{className:'sm '+(pageNum===txPage?'primary':'ghost'),onclick:function(){txPage=pageNum;loadTxData()}},String(pageNum+1)))
          })(pageNum)
        }
        pg.appendChild(el('button',{className:'sm ghost',disabled:txPage>=pages-1,onclick:function(){if(txPage<pages-1){txPage++;loadTxData()}}},'›'))
        cont.appendChild(pg)
      }
    })
    .catch(function(e){cont.innerHTML='<div class="empty"><p>Ошибка: '+e.message+'</p></div>'})
}

function buildPagerPages(curr,total){
  var s=new Set()
  var i,first=[0,1,2],last=[total-3,total-2,total-1]
  for(i=0;i<first.length;i++)s.add(first[i])
  for(i=0;i<last.length;i++)s.add(last[i])
  for(i=-1;i<=1;i++)s.add(curr+i)
  var arr=[]
  s.forEach(function(x){if(x>=0&&x<total)arr.push(x)})
  arr.sort(function(a,b){return a-b})
  var res=[]
  for(i=0;i<arr.length;i++){
    if(i>0&&arr[i]-arr[i-1]>1)res.push({t:'e'})
    res.push({t:'n',v:arr[i]})
  }
  return res
}

function showQrScanner(onItems, mode){
  var maxFiles = 10;
  var inputId = mode === 'camera' ? 'receipt-upload-camera' : 'receipt-upload-gallery';
  var fileInput = document.getElementById(inputId);
  if (!fileInput) {
    var attrs = { id: inputId, type: 'file', accept: 'image/*', style: 'display:none' };
    if (mode === 'camera') {
      attrs.capture = 'environment';
    } else {
      attrs.multiple = true;
    }
    fileInput = el('input', attrs);
    document.body.appendChild(fileInput);
  }

  fileInput.onchange = async function(e) {
    var files = Array.from(e.target.files || []);
    if (!files.length) return;

    if (files.length > maxFiles) {
      toast('Можно выбрать не более ' + maxFiles + ' фото за один раз (выбрано: ' + files.length + ')', 'err');
      files = files.slice(0, maxFiles);
    }

    var allCombinedItems = [];
    var totalPrefill = null;
    var successCount = 0;
    var errorCount = 0;

    var badge = document.getElementById('receipt-progress-badge');
    if (!badge) {
      badge = el('div', { id: 'receipt-progress-badge', className: 'receipt-progress-badge' }, [
        el('div', { className: 'receipt-progress-spinner' }),
        el('span', { id: 'receipt-progress-text' }, '')
      ]);
      document.body.appendChild(badge);
    }
    var badgeText = document.getElementById('receipt-progress-text');

    for (var i = 0; i < files.length; i++) {
      if (badgeText) {
        badgeText.textContent = 'Обработка чека ' + (i + 1) + ' из ' + files.length + '...';
      }
      var file = files[i];
      var formData = new FormData();
      formData.append('receipt', file);

      try {
        var r = await fetch(API + 'api/instances/' + curInst.id + '/upload-receipt', {
          method: 'POST',
          body: formData,
          headers: { 'Authorization': 'Bearer ' + token }
        });
        var data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Ошибка распознавания');

        window._lastScannedImagePath = data.image_path;
        if (data.items && data.items.length) {
          allCombinedItems = allCombinedItems.concat(data.items);
        }
        if (!totalPrefill) {
          totalPrefill = data;
        } else if (data.total) {
          totalPrefill.total = (parseFloat(totalPrefill.total) || 0) + (parseFloat(data.total) || 0);
        }
        successCount++;
      } catch (err) {
        errorCount++;
        toast('Ошибка (' + file.name + '): ' + err.message, 'err');
      }
    }

    if (badge) badge.remove();
    fileInput.value = '';

    if (successCount > 0 && totalPrefill) {
      totalPrefill.items = allCombinedItems;
      toast('Готово! Обработано чеков: ' + successCount + (errorCount ? ' (ошибок: ' + errorCount + ')' : ''), 'ok');
      onItems(totalPrefill);
    }
  };

  fileInput.click();
}

function showTxForm(tx,prefill){
  var isEdit=!!tx
  var curType=(isEdit&&tx.type)?tx.type:'expense'
  var items=[{name:'',price:'',quantity:'',amount:'',category:'',category_id:''}]
  if(isEdit&&tx.type==='expense'){
    items=[{id:tx.id,name:tx.name,price:tx.price||'',quantity:tx.quantity||'',amount:tx.amount,category:tx.category||'',category_id:tx.category_id||''}]
  } else if(isEdit){
    items=[{id:tx.id,name:tx.name,price:'',quantity:'',amount:tx.amount,category:'',category_id:tx.category_id||''}]
  } else if(prefill&&prefill.items&&prefill.items.length){
    var expCats = typeof getCatsByType === 'function' ? getCatsByType('expense') : (window._allCats || []);
    items=prefill.items.map(function(it){
      var q=parseFloat(it.quantity)||1
      var catId = it.category_id || ''
      if (!catId && it.category) {
        var cName = (it.category || '').trim().toLowerCase()
        for (var c = 0; c < expCats.length; c++) {
          if (expCats[c].name.toLowerCase() === cName) {
            catId = expCats[c].id
            break
          }
        }
      }
      return{name:(it.name||'').replace(/^\d+[\.\)]\s*/,''),price:it.price||'',quantity:q,amount:parseFloat(it.amount)||(parseFloat(it.price)*q)||'',category:it.category||'',category_id:catId}
    })
  }

  // Planned expense state
  var plannedCb=null
  var recurringCb=null
  var plannedDateInput=null
  var txDatePicker=null


  function buildCatSelect(idx,selectedId){
    var cats=getCatsByType('expense')
    var opts=[el('option',{value:''},'— Выберите —')]
    for(var i=0;i<cats.length;i++){
      opts.push(el('option',{value:cats[i].id},cats[i].name))
    }
    var sel=el('select',{id:'cat-sel-'+idx,onchange:function(){
      items[idx].category_id=this.value
      for(var k=0;k<cats.length;k++){
        if(String(cats[k].id)===this.value){items[idx].category=cats[k].name;break}
      }
    }},opts)
    sel.value=selectedId
    return sel
  }

  var suggestTimers={}

  function applyCategoryToRow(idx, categoryId, categoryName){
    var sel = document.getElementById('cat-sel-' + idx)
    if(!sel) return false
    var targetId = ''
    var targetName = ''

    if(categoryId){
      for(var i=0;i<sel.options.length;i++){
        if(String(sel.options[i].value)===String(categoryId) && sel.options[i].value!==''){
          targetId = String(sel.options[i].value)
          targetName = sel.options[i].text
          break
        }
      }
    }
    if(!targetId && categoryName){
      var cleanName = categoryName.trim().toLowerCase()
      for(var i=0;i<sel.options.length;i++){
        if(sel.options[i].value && sel.options[i].text.trim().toLowerCase()===cleanName){
          targetId = String(sel.options[i].value)
          targetName = sel.options[i].text
          break
        }
      }
    }
    if(!targetId && categoryName){
      var cleanName = categoryName.trim().toLowerCase()
      for(var i=0;i<sel.options.length;i++){
        var optText = sel.options[i].text.trim().toLowerCase()
        if(sel.options[i].value && (optText.includes(cleanName) || cleanName.includes(optText))){
          targetId = String(sel.options[i].value)
          targetName = sel.options[i].text
          break
        }
      }
    }
    if(targetId){
      if(items[idx]){
        items[idx].category_id = targetId
        items[idx].category = targetName
      }
      sel.value = targetId
      for(var o=0;o<sel.options.length;o++){
        sel.options[o].selected = (String(sel.options[o].value)===targetId)
      }
      sel.dispatchEvent(new Event('change'))
      return true
    }
    return false
  }

  function suggestCategory(idx,name){
    if(!name||name.length<2){
      var hint=document.getElementById('cat-hint-'+idx)
      if(hint){
        hint.innerHTML=''
        hint._suggestedCat=null
      }
      return
    }
    clearTimeout(suggestTimers[idx])
    suggestTimers[idx]=setTimeout(function(){
      api('api/instances/'+curInst.id+'/suggest-category?name='+encodeURIComponent(name))
        .then(function(result){
          var hint=document.getElementById('cat-hint-'+idx)
          if(!hint)return
          if(result.category&&result.confidence>=30){
            var confColor=result.confidence>=70?'var(--green)':result.confidence>=50?'var(--orange)':'var(--text3)'
            hint.innerHTML='<span style="color:'+confColor+';font-size:11px">💡 '+result.category+' ('+result.confidence+'%)</span>'
            hint.style.cursor='pointer'
            hint._suggestedCat={id:result.category_id,name:result.category}
            applyCategoryToRow(idx, result.category_id, result.category)
            hint.onclick=function(){
              applyCategoryToRow(idx, result.category_id, result.category)
            }
          } else {
            hint.innerHTML=''
            hint._suggestedCat=null
          }
        }).catch(function(){})
    },300)
  }

  function switchType(newType){
    curType=newType
    var expenseBlock=document.getElementById('expense-block')
    var incomeBlock=document.getElementById('income-block')
    var savingsBlock=document.getElementById('savings-block')
    if(expenseBlock)expenseBlock.style.display=newType==='expense'?'block':'none'
    if(incomeBlock)incomeBlock.style.display=newType==='income'?'block':'none'

    var plannedDateGroup=document.getElementById('planned-date-group')
    var txTools=document.getElementById('tx-tools')

    if(plannedGroup)plannedGroup.style.display=isExpense?'flex':'none'
    if(txTools)txTools.style.display=isExpense?'flex':'none'

    if(!isExpense){

    }
  }


  var b=el('div',{},[
    el('div',{className:'form-grid'},[
      el('div',{className:'form-group'},[
        el('label',{},'Тип'),
        (function(){
          var sel=el('select',{id:'tx-type',onchange:function(){switchType(this.value)}},[
            el('option',{value:'expense'},'Расход'),
            el('option',{value:'income'},'Доход'),
            el('option',{value:'savings'},'Накопления')
          ])
          sel.value=curType
          return sel
        })()
      ]),
      el('div',{className:'form-group'},[
        el('label',{},'Дата *'),
        (function(){
          var inp=el('input',{id:'tx-date',readonly:'',value:isEdit?(typeof tx.date==='string'?tx.date.slice(0,10):tx.date):(prefill&&prefill.date?prefill.date:new Date().toISOString().slice(0,10)),style:'cursor:pointer'})
          txDatePicker=dp(inp,{value:inp.value})
          return inp
        })()
      ]),
      el('div',{className:'form-group',id:'planned-group'},[
        el('label',{},''),
        el('div',{style:'display:flex;flex-direction:column;gap:8px;margin-top:16px'},[
          el('label',{className:'form-check-lbl'},[
            (function(){
              plannedCb=el('input',{type:'checkbox',className:'form-check'})
              plannedCb.addEventListener('change',function(){
                if(plannedDateInput&&plannedDateInput.parentNode)plannedDateInput.parentNode.style.display=this.checked?'flex':'none'
                var recWrap=document.getElementById('recurring-cb-wrap')
                if(recWrap)recWrap.style.display=this.checked?'flex':'none'
                if(!this.checked&&recurringCb)recurringCb.checked=false
              })
              if(isEdit&&tx.is_planned)plannedCb.checked=true
              return plannedCb
            })(),
            'Запланировать расход'
          ]),
          el('label',{id:'recurring-cb-wrap',className:'form-check-lbl',style:isEdit&&tx.is_planned?'display:flex':'display:none'},[
            (function(){
              recurringCb=el('input',{type:'checkbox',className:'form-check'})
              if(isEdit&&tx.is_recurring)recurringCb.checked=true
              return recurringCb
            })(),
            '🔄 Сделать ежемесячным'
          ])
        ])
      ]),

      el('div',{className:'form-group',id:'planned-date-group',style:isEdit&&tx.is_planned?'':'display:none'},[
        el('label',{},'Дата планирования *'),
        (function(){
          var pv=''
          if(isEdit&&tx.planned_date)pv=tx.planned_date
          plannedDateInput=el('input',{type:'text',readonly:'',placeholder:'Нажмите для выбора',value:pv,style:'cursor:pointer'})
          dp(plannedDateInput,{value:pv})
          return plannedDateInput
        })()
      ])
    ]),
    isEdit?null:el('div',{id:'tx-tools',style:'display:flex;gap:8px;margin-block:12px;flex-wrap:wrap'},[
      el('button',{className:'sm danger',style:'display:none',id:'report-issue-btn',onclick:function(){
         var btn = this;
         btn.disabled = true;
         btn.textContent = 'Отправка...';
         api('api/instances/'+curInst.id+'/report-scanner-issue', {
           method: 'POST',
           body: JSON.stringify({
             description: "Автоматический репорт ошибки сканирования", 
             image_path: window._lastScannedImagePath,
             logs: window._lastScanLogs
           })
         }).then(function(){ 
            toast('Отчет и фото отправлены разработчику');
            btn.style.display = 'none';
         })
         .catch(function(e){ 
            toast('Ошибка отправки: '+e.message, 'err');
            btn.disabled = false;
            btn.textContent = '⚠️ Сообщить об ошибке';
         })
      }},'⚠️ Сообщить об ошибке')
    ]),
    el('div',{id:'expense-block'},[
      el('div',{style:'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'},[
        el('label',{style:'font-size:13px;color:var(--text2)'},'Позиции чека')
      ]),
      el('div',{className:'tx-items-header',style:'display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.5fr auto;gap:8px;margin-bottom:4px;padding:0 4px'},[
        el('span',{style:'font-size:11px;color:var(--text3)'},'Название'),
        el('span',{style:'font-size:11px;color:var(--text3)'},'Цена/ед'),
        el('span',{style:'font-size:11px;color:var(--text3)'},'Кол-во'),
        el('span',{style:'font-size:11px;color:var(--text3)'},'Сумма'),
        el('span',{style:'font-size:11px;color:var(--text3)'},'Категория'),
        el('span',{})
      ]),
      el('style',{},'@media(max-width:768px){.tx-items-header{display:none!important}}'),
      el('div',{id:'tx-items-container'}),
      isEdit?null:el('button',{className:'btn btn-success sm',style:'margin-top:8px;margin-bottom:4px',onclick:addItem,type:'button'},'+ Добавить позицию'),
      el('div',{id:'tx-total',style:'text-align:right;font-weight:600;font-size:15px;margin-top:12px',textContent:'Итого: 0.00 ₽'}),
      el('div',{className:'form-group',style:'margin-top:16px'},[
        el('label',{},'Комментарий к чеку / расходу'),
        (function(){
          var inp=el('input',{id:'tx-common-comment',placeholder:'Необязательно'})
          if(isEdit&&tx&&tx.comment)inp.value=tx.comment
          return inp
        })()
      ])
    ]),
    el('div',{id:'income-block',style:'display:none'},[
      buildIncomeRow()
    ]),
    el('div',{id:'savings-block',style:'display:none'},[
      buildSavingsRow()
    ]),
    el('div',{className:'form-actions'},[
      el('button',{className:'primary',onclick:function(){
        var date=getDateVal('tx-date')
        var type=document.getElementById('tx-type').value
        if(!date)return toast('Укажите дату','err')
        if(type==='income'){
          var name=document.getElementById('inc-name').value
          var amount=parseFloat(document.getElementById('inc-amount').value)
          var catSelect=document.getElementById('inc-cat')
          var category=catSelect?catSelect.value:''
          if(!name||!amount)return toast('Заполните название и сумму','err')
          var body={name:name,type:'income',date:date,amount:amount,category_id:category||undefined}
          var method='POST'
          var path='api/instances/'+curInst.id+'/transactions'
          if(isEdit){method='PUT';path+='/'+tx.id}
          api(path,{method:method,body:JSON.stringify(body)})
            .then(function(){mclose();toast(isEdit?'Сохранено':'Добавлено');loadTxData();loadDash()})
            .catch(function(e){toast(e.message,'err')})
        } else if(type==='savings'){
          var savName=document.getElementById('sav-name').value
          var savAmount=parseFloat(document.getElementById('sav-amount').value)
          var savGoal=document.getElementById('sav-goal').value
          var savComment=document.getElementById('sav-comment').value
          if(!savName||!savAmount)return toast('Заполните название и сумму','err')
          var savBody={
            name:savName,
            type:'savings',
            date:date,
            amount:savAmount,
            category:savGoal?'Цели':'Свободные накопления',
            comment:savComment||'',
            savings_type:savGoal?'goal':'free',
            goal_id:savGoal?parseInt(savGoal):null
          }
          api('api/instances/'+curInst.id+'/transactions',{method:'POST',body:JSON.stringify(savBody)})
            .then(function(){mclose();toast('Накопление добавлено');loadTxData();loadDash();loadSavings()})
            .catch(function(e){toast(e.message,'err')})
        } else {
          var isPlanned=plannedCb?plannedCb.checked:false
          var isRecurring=isPlanned&&(recurringCb?recurringCb.checked:false)
          var plannedDate=plannedDateInput?getDateVal(plannedDateInput):null
          var toSave=[]
          var cmtInput=document.getElementById('tx-common-comment')
          var commonComment=cmtInput?cmtInput.value:''
          var missingCategory = false
          for(var i=0;i<items.length;i++){
            if(!items[i].name||!items[i].amount)continue
            var selEl = document.getElementById('cat-sel-' + i)
            if(!items[i].category_id){
              missingCategory = true
              if(selEl && selEl.parentNode && selEl.parentNode.classList.contains('cds')){
                selEl.parentNode.classList.add('invalid')
              }
            } else {
              if(selEl && selEl.parentNode && selEl.parentNode.classList.contains('cds')){
                selEl.parentNode.classList.remove('invalid')
              }
            }
            toSave.push({id:items[i].id||undefined,name:items[i].name,type:'expense',date:isPlanned&&plannedDate?plannedDate:date,price:parseFloat(items[i].price)||null,quantity:parseFloat(items[i].quantity)||null,amount:parseFloat(items[i].amount),category_id:items[i].category_id||undefined,category:items[i].category||undefined,is_planned:isPlanned,planned_date:plannedDate||null,is_recurring:isRecurring,receipt_key:window._lastReceiptKey||null,comment:commonComment})
          }

          if(!toSave.length)return toast('Заполните название и сумму хотя бы одной позиции','err')
          if(missingCategory)return toast('⚠️ Пожалуйста, выберите категорию для всех позиций!','err')

          var doSaveExpenses = function(){
            if(isEdit&&tx.type==='expense'&&items.length===1&&items[0].id){
              api('api/instances/'+curInst.id+'/transactions/'+tx.id,{method:'PUT',body:JSON.stringify(toSave[0])})
                .then(function(){mclose();toast('Сохранено');loadTxData();loadDash()})
                .catch(function(e){toast(e.message,'err')})
            }else{
              var saved=0,errors=0,total=toSave.length
              for(var j=0;j<total;j++){
                api('api/instances/'+curInst.id+'/transactions',{method:'POST',body:JSON.stringify(toSave[j])})
                  .then(function(){saved++;if(saved+errors===total){mclose();toast('Добавлено: '+saved+' позиций');loadTxData();loadDash()}})
                  .catch(function(){errors++;if(saved+errors===total){mclose();if(errors)toast('Ошибки: '+errors,'err');loadTxData();loadDash()}})
              }
            }
          }

          if(isEdit){
            doSaveExpenses()
          }else{
            api('api/instances/'+curInst.id+'/transactions/check-duplicates',{method:'POST',body:JSON.stringify({items:toSave})})
              .then(function(res){
                if(res.duplicates && res.duplicates.length > 0){
                  var dupMsg = 'Обнаружено совпадение ('+res.duplicates.length+') по дате, сумме и количеству:\n\n'
                  for(var dk=0;dk<res.duplicates.length;dk++){
                    var newItem = res.duplicates[dk].item
                    var existingItem = res.duplicates[dk].existing
                    dupMsg += '🔹 В базе уже есть: «' + (existingItem.name || 'Без названия') + '»\n'
                    dupMsg += '🔸 Вы добавляете: «' + (newItem.name || 'Без названия') + '»\n'
                    dupMsg += '   (Дата: ' + fmtD(newItem.date) + ', Сумма: ' + fmt(newItem.amount) + ' ₽' + (newItem.quantity ? ', Кол-во: ' + newItem.quantity : '') + ')\n\n'
                  }
                  dupMsg += 'Вы действительно хотите добавить эту позицию?'
                  confirmModal(dupMsg, function(){
                    doSaveExpenses()
                  }, 'Всё равно добавить', 'primary')
                }else{
                  doSaveExpenses()
                }
              })
              .catch(function(){
                doSaveExpenses()
              })
          }
        }
      }},isEdit?'Сохранить':'Добавить'),
      el('button',{className:'ghost',onclick:mclose},'Отмена')
    ])
  ])

  var _o=modal(isEdit?'Редактировать':'Новая транзакция',b)
  fixModalTop(_o)
  switchType(curType)
  setTimeout(function(){
    renderItems()
    if(prefill&&prefill.items&&prefill.items.length){
      var hint=document.getElementById('tx-total')
      if(hint)hint.textContent='Итого: '+fmt(prefill.total||calcTotal())+' ₽'+(prefill.seller?' · '+prefill.seller:'')
      toast('Добавлено '+items.length+' позиций из чека')
    }
    // Auto-categorize items without category
    autoCategorizeItems(items)
  },100)
  function calcTotal(){
    var s=0
    for(var i=0;i<items.length;i++)s+=parseFloat(items[i].amount)||parseFloat(items[i].price)*parseFloat(items[i].quantity)||0
    return s
  }
}

function autoCategorizeItems(itemsToCategorize){
  var pending=0
  for(var i=0;i<itemsToCategorize.length;i++){
    if(itemsToCategorize[i].category_id)continue
    var name=itemsToCategorize[i].name
    if(!name||name.length<2)continue
    pending++
    api('api/instances/'+curInst.id+'/suggest-category?name='+encodeURIComponent(name))
      .then((function(idx){return function(result){
        if(result.category&&result.confidence>=30){
          applyCategoryToRow(idx, result.category_id, result.category)
        }
      }})(i))
      .catch(function(){})
  }
  if(pending>0)toast('Категоризация: '+pending+' позиций обрабатывается')
}

function confirmModal(msg,onOk,okText,okClass){
  var overlay=el('div',{className:'modal-overlay active'},[
    el('div',{className:'modal',style:'max-width:360px'},[
      el('div',{className:'modal-hdr'},[
        el('h2',{},'Подтверждение'),
        el('span',{className:'modal-x',onclick:function(){overlay.remove()}},'×')
      ]),
      el('div',{style:'padding:16px 0'},[
        el('p',{style:'font-size:14px;color:var(--text2);margin-bottom:20px;white-space:pre-line;line-height:1.5'},msg),
        el('div',{style:'display:flex;gap:8px;justify-content:flex-end'},[
          el('button',{className:'ghost',onclick:function(){overlay.remove()}},'Отмена'),
          el('button',{className:okClass||'danger',onclick:function(){overlay.remove();onOk()}},okText||'Удалить')
        ])
      ])
    ])
  ])
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()})
  document.body.appendChild(overlay)
}

function delTx(id){
  confirmModal('Удалить эту транзакцию?',function(){
    api('api/instances/'+curInst.id+'/transactions/'+id,{method:'DELETE'})
      .then(function(){toast('Удалено');loadTxData()})
      .catch(function(e){toast(e.message,'err')})
  })
}

// ==================== INIT ====================
function init(){
  if(token){
    api('api/auth/me')
      .then(function(u){
        user=u;
        if(user && user.is_demo && user.demo){
          startDemoTimer(user.demo.seconds_remaining)
        }
        return loadCategories()
      })
      .then(function(){return loadInsts()})
      .then(function(){
        if(targetInstId && instances.some(function(i){return i.id===targetInstId})){
          curInst=instances.find(function(i){return i.id===targetInstId})
        }
        if(instances.length){
          if(!curInst) curInst=instances[0];
          renderApp()
        }else{
          renderInstanceGate()
        }
      })
      .catch(function(){
        clearDemoTimer();
        token=null;
        localStorage.removeItem('token');
        tryTelegramWebAppAuth()
      })
  } else {
    tryTelegramWebAppAuth()
  }
}

function tryTelegramWebAppAuth(){
  if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData){
    fetch(API+'api/auth/telegram-webapp',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({initData:window.Telegram.WebApp.initData})
    })
    .then(function(r){return r.ok?r.json():Promise.reject()})
    .then(function(d){
      if(d && d.token){
        token=d.token
        localStorage.setItem('token',token)
        user=d.user
        if(d.instance_id) targetInstId=d.instance_id
        return loadCategories().then(function(){return loadInsts()}).then(function(){
          if(targetInstId && instances.some(function(i){return i.id===targetInstId})){
            curInst=instances.find(function(i){return i.id===targetInstId})
          }
          if(instances.length){
            if(!curInst) curInst=instances[0];
            renderApp()
          }else{
            renderInstanceGate()
          }
        })
      } else {
        renderLanding()
      }
    })
    .catch(function(){
      renderLanding()
    })
  } else {
    renderLanding()
  }
}

        el('div',{},[

          el('div',{style:'font-size:12px;color:var(--text3)'},plan.is_admin ? 'Полный безлимитный доступ администратора' : (plan.expires_at ? 'Активен до: ' + new Date(plan.expires_at).toLocaleDateString() : 'Бессрочный тариф'))
        ]),
        el('span',{className:'badge badge-owner',style:'font-size:12px;padding:4px 10px'},plan.badge || 'FREE')
      ]),

      el('h3',{style:'font-size:14px;font-weight:600;margin-bottom:10px;color:var(--text)'},'Расход лимитов в текущем месяце:'),
      el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px'},[
        el('div',{style:'background:var(--surface2);padding:12px;border-radius:var(--rs)'},[
          el('div',{style:'font-size:11px;color:var(--text3)'},'Бюджетов (инстансов)'),

          el('div',{style:'font-size:11px;color:var(--text3)'},'Транзакций в бюджете'),

          el('div',{style:'font-size:16px;font-weight:700;color:var(--text)'},usage.receiptScansMonth + ' / ' + scanLimitText)
        ]),
        el('div',{style:'background:var(--surface2);padding:12px;border-radius:var(--rs)'},[
          el('div',{style:'font-size:11px;color:var(--text3)'},'AI-советов (месяц)'),
          el('div',{style:'font-size:16px;font-weight:700;color:var(--text)'},usage.aiAdvicesMonth + ' / ' + aiLimitText)
        ]),
        el('div',{style:'background:var(--surface2);padding:12px;border-radius:var(--rs)'},[
          el('div',{style:'font-size:11px;color:var(--text3)'},'Совместный доступ'),
          el('div',{style:'font-size:13px;font-weight:600;color:var(--text)'},memberLimitText)
        ]),
        el('div',{style:'background:var(--surface2);padding:12px;border-radius:var(--rs)'},[
          el('div',{style:'font-size:11px;color:var(--text3)'},'Импорт выписок (XLSX)'),
          el('div',{style:'font-size:13px;font-weight:600;color:var(--text)'},importText)
        ])

      el('div',{style:'display:flex;justify-content:flex-end'},[

      ])

    modal('Ваш тарифный план', body)
  }).catch(function(err){
    toast(err.message,'err')
  })
}
