services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finance_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: finance
      DB_USER: finance
      DB_PASSWORD: ${DB_PASSWORD:-finance_secret}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TG_ID: ${ADMIN_TG_ID}
      AGY_INTERNAL_KEY: ${AGY_INTERNAL_KEY}
      AGY_INFERENCE_URL: http://agy-inference:8799
      MARKET_ENGINE_URL: http://host.docker.internal:8795
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-TIIN Finance <noreply@tiinservice.online>}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /home/alvik/uploaded:/app/uploaded
      - /home/alvik/.hermes/skills/receipt-scanner/scripts/scan_receipt.py:/app/scripts/scan_receipt.py

volumes:
  pgdata:
