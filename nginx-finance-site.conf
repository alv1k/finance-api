server {
    listen 127.0.0.1:8449 ssl proxy_protocol;
    server_name finance.tiinservice.online;

    access_log /var/log/nginx/finance-access.log proxy_protocol;
    error_log /var/log/nginx/finance-error.log error;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate /etc/letsencrypt/live/finance.tiinservice.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.tiinservice.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}
